<text x="690.0" y="111" fill="#eef1e6" font-size="17" font-weight="600" text-anchor="middle">UMortisANS_ActivateInputBuffer</text>
<text x="690.0" y="135" fill="#a6b29c" font-size="12.8" font-weight="400" text-anchor="middle">허용 구간의 Roll / LightAttack / WeaponSkill 입력</text>
<rect x="40" y="222" width="380" height="88" rx="8" fill="#202720" stroke="#46543e"/>
<text x="230.0" y="257" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">공격 어빌리티 종료</text>
<text x="230.0" y="281" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">예약한 다음 행동 전달 시점</text>
<rect x="500" y="222" width="380" height="88" rx="8" fill="#273322" stroke="#8fa765"/>
<text x="690.0" y="257" fill="#d6ed9a" font-size="19" font-weight="600" text-anchor="middle">BufferedInputTag</text>
<text x="690.0" y="281" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">가장 최근 입력 하나 저장</text>
