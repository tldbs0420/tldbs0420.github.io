<polyline points="690.0,164 690.0,193.0 690.0,193.0 690.0,222" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="230.0,310 230.0,339.0 460.0,339.0 460.0,368" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="690.0,310 690.0,339.0 460.0,339.0 460.0,368" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="76" width="380" height="88" rx="8" fill="#202720" stroke="#46543e"/>
<text x="230.0" y="111" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">공격 어빌리티 실행</text>
<text x="230.0" y="135" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">공격 몽타주</text>
