<svg xmlns="http://www.w3.org/2000/svg" width="920" height="444" viewBox="0 0 920 444" role="img" aria-labelledby="title desc">
<title id="title">공통 호출과 좀비별 Animator 연결</title><desc id="desc">적 AI는 ZombieAnimator의 공통 함수를 호출하고, NormalZombieAnimator와 Boss1Animator, Boss2Animator가 각 Animator에 맞춰 재정의합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#6c8058" stroke-width="1.5"/></marker></defs>
<defs><marker id="inheritance" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12Z" fill="#181c19" stroke="#6c8058" stroke-width="1.5"/></marker></defs>
<rect width="920" height="444" fill="#181c19"/>
<g font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="34" y="35" fill="#eef1e6" font-size="20" font-weight="600" text-anchor="start">공통 호출과 좀비별 Animator 연결</text>
<text x="886" y="35" fill="#a6b29c" font-size="10" font-weight="500" text-anchor="end">SYSTEM / FLOW</text>
<polyline points="420,120.0 500,120.0" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="441.0" y="94.0" width="38" height="20" rx="3" fill="#181c19"/>
<text x="460.0" y="108.0" fill="#a6b29c" font-size="12" font-weight="500" text-anchor="middle">호출</text>
<polyline points="160,260 160,210 690,210 690,164" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#inheritance)"/>
<polyline points="460,260 460,210 690,210 690,164" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#inheritance)"/>
<polyline points="760,260 760,210 690,210 690,164" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#inheritance)"/>
<rect x="40" y="76" width="380" height="88" rx="8" fill="#202720" stroke="#46543e"/>
<text x="230.0" y="111" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">적 AI</text>
<text x="230.0" y="135" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">같은 행동 함수 호출</text>
<rect x="500" y="76" width="380" height="88" rx="8" fill="#273322" stroke="#8fa765"/>
<text x="690.0" y="111" fill="#d6ed9a" font-size="19" font-weight="600" text-anchor="middle">ZombieAnimator (abstract)</text>
<text x="690.0" y="135" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">virtual StartWalking() / StartAttack()</text>
<rect x="30" y="260" width="260" height="100" rx="8" fill="#202720" stroke="#46543e"/>
<text x="160.0" y="295" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">NormalZombieAnimator</text>
<text x="160.0" y="319" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">override StartAttack()</text>
<text x="160.0" y="339" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">AttackMotion 선택 + Trigger</text>
<rect x="330" y="260" width="260" height="100" rx="8" fill="#202720" stroke="#46543e"/>
<text x="460.0" y="295" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">Boss1Animator</text>
<text x="460.0" y="319" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">override StartDownAttack()</text>
<text x="460.0" y="339" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">보스의 DownAttack Trigger</text>
<rect x="630" y="260" width="260" height="100" rx="8" fill="#202720" stroke="#46543e"/>
<text x="760.0" y="295" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">Boss2Animator</text>
<text x="760.0" y="319" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">override StartAttack()</text>
<text x="760.0" y="339" fill="#a6b29c" font-size="13.7" font-weight="400" text-anchor="middle">LOD1 / LOD2 Animator 동시 호출</text>
<path d="M34 395H886" stroke="#313c2d"/>
<text x="34" y="419" fill="#a6b29c" font-size="12" font-weight="400" text-anchor="start">빈 삼각형은 상속 / 점선 화살표는 참조 / 호출</text>
</g></svg>
