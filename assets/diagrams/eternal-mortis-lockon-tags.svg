<text x="690.0" y="634" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">두 상태 태그가 없는 기본 락온</text>
<path d="M34 714H886" stroke="#313c2d"/>
<text x="34" y="738" fill="#a6b29c" font-size="12" font-weight="400" text-anchor="start">State.Action.Attacking이 Roll / Sprint와 동시에 있으면 공격 방향 회전이 우선</text>
