<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">음악 시간 하나로 판정과 위치 보정 연결</title><desc id="desc">FMOD 채널의 재생 위치와 싱크 설정을 기준으로 판정 오차와 생성·배속 변경 시 노트 위치를 계산합니다. 평상시 화면 이동은 Time.deltaTime으로 처리합니다.</desc>
