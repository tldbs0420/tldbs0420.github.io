<rect x="270.0" y="222" width="380" height="88" rx="8" fill="#273322" stroke="#8fa765"/>
<text x="460.0" y="257" fill="#d6ed9a" font-size="19" font-weight="600" text-anchor="middle">같은 음악 시간을 기준으로 처리</text>
<text x="460.0" y="281" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">판정과 위치 계산의 기준 공유</text>
