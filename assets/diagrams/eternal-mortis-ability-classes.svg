<svg xmlns="http://www.w3.org/2000/svg" width="920" height="899" viewBox="0 0 920 899" role="img" aria-labelledby="title desc">
<title id="title">공통 C++ 기반과 스킬 Blueprint의 확장</title><desc id="desc">공통 어빌리티 기반에서 플레이어 기능을 확장하고, GA_Player_Skill_Base에서 스킬 공통 처리를 묶었습니다. 개별 무기 스킬 BP는 이 클래스를 상속해 동작을 구현합니다.</desc>
