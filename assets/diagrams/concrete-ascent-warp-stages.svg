<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">진입 방식 변경과 구간별 위치 보정</title><desc id="desc">Chooser의 첫 유효 몽타주에서 PoseSearchBranchIn 종료 시점 이후를 재생하고 시작, 중간, 끝의 Warp Target과 Notify 범위를 조정합니다.</desc>
