<polyline points="420,266.0 500,266.0" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="690.0,310 690.0,339.0 690.0,339.0 690.0,368" fill="none" stroke="#6c8058" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="76" width="380" height="88" rx="8" fill="#202720" stroke="#46543e"/>
