<text x="230.0" y="257" fill="#eef1e6" font-size="19" font-weight="600" text-anchor="middle">시작 / 접근</text>
<text x="230.0" y="281" fill="#a6b29c" font-size="14" font-weight="400" text-anchor="middle">앞쪽 모서리를 기준으로 보정</text>
