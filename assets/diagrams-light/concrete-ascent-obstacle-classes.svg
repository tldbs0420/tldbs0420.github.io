<svg xmlns="http://www.w3.org/2000/svg" width="920" height="458" viewBox="0 0 920 458" role="img" aria-labelledby="title desc">
<title id="title">장애물 기준 정보와 난간 이동의 확장</title><desc id="desc">AParkourObstacleBase는 Box 기준의 앞뒤 모서리 정보를 제공합니다. ALedgeObstacle는 이를 상속해 난간 이동 구간을 추가하고, UParkourTraversalComponent가 두 정보를 사용합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<defs><marker id="inheritance" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12Z" fill="#f4f5f4" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<rect width="920" height="458" fill="#f4f5f4"/>
<g font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="34" y="35" fill="#16190e" font-size="20" font-weight="600" text-anchor="start">장애물 기준 정보와 난간 이동의 확장</text>
<text x="886" y="35" fill="#57634d" font-size="10" font-weight="500" text-anchor="end">SYSTEM / FLOW</text>
<polyline points="230,270 230,180" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#inheritance)"/>
<polyline points="500,128.0 420,128.0" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="417.0" y="102.0" width="86" height="20" rx="3" fill="#f4f5f4"/>
<text x="460.0" y="116.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">기준점 조회</text>
<polyline points="690,180 690,322 420,322" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="530.0" y="296" width="110" height="20" rx="3" fill="#f4f5f4"/>
<text x="585" y="310" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">난간 구간 조회</text>
<rect x="40" y="76" width="380" height="104" rx="8" fill="#d1ddcc" stroke="#829a58"/>
<text x="230.0" y="111" fill="#4e6512" font-size="19" font-weight="600" text-anchor="middle">AParkourObstacleBase : AActor</text>
<text x="230.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">TraversalBounds : UBoxComponent</text>
<text x="230.0" y="155" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">GetTraversalLedgeData()</text>
<rect x="500" y="76" width="380" height="104" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">UParkourTraversalComponent</text>
<text x="690.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">장애물 기준점 + 공간 검사</text>
<text x="690.0" y="155" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">TryAirLedgeGrab() / ClimbFromLedge()</text>
<rect x="40" y="270" width="380" height="104" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="230.0" y="305" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">ALedgeObstacle</text>
<text x="230.0" y="329" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">GetLedgeMoveSegment()</text>
<text x="230.0" y="349" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">난간 중심 / 이동 방향 / 절반 길이</text>
<path d="M34 409H886" stroke="#c7d2c3"/>
<text x="34" y="433" fill="#57634d" font-size="12" font-weight="400" text-anchor="start">빈 삼각형은 상속 / 점선 화살표는 참조 / 호출</text>
</g></svg>
