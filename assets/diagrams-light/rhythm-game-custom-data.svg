<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">공통 선택값과 커스터마이징 데이터</title><desc id="desc">PlayerCustomize가 테마, 노트 세트, 라인별 선택값을 보관합니다. ThemeData는 NotesData를, NotesData는 네 개의 LineData를 참조하고 Preview가 선택값을 읽습니다.</desc>
