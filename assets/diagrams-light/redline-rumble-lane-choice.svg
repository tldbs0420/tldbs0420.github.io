<svg xmlns="http://www.w3.org/2000/svg" width="920" height="686" viewBox="0 0 920 686" role="img" aria-labelledby="title desc">
<title id="title">감지 결과에 따른 상대 차량의 목표 선택</title><desc id="desc">플레이어 차선이 비면 진로를 방해하고 막혀 있으면 다른 차선을 고릅니다. 모두 막히면 반대편 차선을 이용한 뒤 복귀합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<defs><marker id="inheritance" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12Z" fill="#f4f5f4" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<rect width="920" height="686" fill="#f4f5f4"/>
<g font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="34" y="35" fill="#16190e" font-size="20" font-weight="600" text-anchor="start">감지 결과에 따른 상대 차량의 목표 선택</text>
<text x="886" y="35" fill="#57634d" font-size="10" font-weight="500" text-anchor="end">SYSTEM / FLOW</text>
<polyline points="460.0,164 460.0,193.0 460.0,193.0 460.0,222" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="460.0,310 460.0,339.0 230.0,339.0 230.0,368" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="320.0" y="317.0" width="50" height="20" rx="3" fill="#f4f5f4"/>
<text x="345.0" y="331.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">비었음</text>
<polyline points="460.0,310 460.0,339.0 690.0,339.0 690.0,368" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="556.0" y="317.0" width="38" height="20" rx="3" fill="#f4f5f4"/>
<text x="575.0" y="331.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">막힘</text>
<polyline points="690.0,456 690.0,485.0 230.0,485.0 230.0,514" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="441.0" y="463.0" width="38" height="20" rx="3" fill="#f4f5f4"/>
<text x="460.0" y="477.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">있음</text>
<polyline points="690.0,456 690.0,485.0 690.0,485.0 690.0,514" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="653.0" y="463.0" width="74" height="20" rx="3" fill="#f4f5f4"/>
<text x="690.0" y="477.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">모두 막힘</text>
<rect x="270.0" y="76" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="460.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">차선별 장애물 / 플레이어 감지</text>
<text x="460.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">차선의 통행 가능 여부 확인</text>
<polygon points="288.0,222 632.0,222 650.0,266.0 632.0,310 288.0,310 270.0,266.0" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="460.0" y="257" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">플레이어 차선이 비었는가?</text>
<text x="460.0" y="281" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">목표 차선 결정</text>
<rect x="40" y="368" width="380" height="88" rx="8" fill="#d1ddcc" stroke="#829a58"/>
<text x="230.0" y="403" fill="#4e6512" font-size="19" font-weight="600" text-anchor="middle">플레이어 차선으로 이동</text>
<text x="230.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">진로 방해</text>
<polygon points="518,368 862,368 880,412.0 862,456 518,456 500,412.0" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="403" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">다른 빈 차선이 있는가?</text>
<text x="690.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">남은 차선 확인</text>
<rect x="40" y="514" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="230.0" y="549" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">빈 차선 선택</text>
<text x="230.0" y="573" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">이동 목표 갱신</text>
<rect x="500" y="514" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="549" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">반대편 차선 이용</text>
<text x="690.0" y="573" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">우회 후 복귀</text>
<path d="M34 637H886" stroke="#c7d2c3"/>
<text x="34" y="661" fill="#57634d" font-size="12" font-weight="400" text-anchor="start">구현 설명을 요약한 개념도</text>
