<text x="460.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">경찰 등장 / 트럭 두 대 생성</text>
<text x="460.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">AI의 기존 차선 선택 중단</text>
<polygon points="288.0,222 632.0,222 650.0,266.0 632.0,310 288.0,310 270.0,266.0" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="460.0" y="257" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">첫 트럭에 플레이어가 있는가?</text>
<text x="460.0" y="281" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">은신할 트럭 선택</text>
<rect x="40" y="368" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="230.0" y="403" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">두 번째 트럭 선택</text>
<text x="230.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">플레이어와 은신 위치 분리</text>
