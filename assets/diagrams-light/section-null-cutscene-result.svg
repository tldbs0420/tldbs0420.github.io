<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
<title id="title">컷씬 종류에 따른 종료 처리</title><desc id="desc">PlayableDirector로 컷씬을 재생하고 종료 후 시작과 보스 컷씬은 플레이로, 승리와 패배 컷씬은 결과 화면으로 연결합니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<defs><marker id="inheritance" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 12 6.5 1 12Z" fill="#f4f5f4" stroke="#93a77f" stroke-width="1.5"/></marker></defs>
<rect width="920" height="540" fill="#f4f5f4"/>
<g font-family="Pretendard,Noto Sans KR,Apple SD Gothic Neo,Malgun Gothic,sans-serif">
<text x="34" y="35" fill="#16190e" font-size="20" font-weight="600" text-anchor="start">컷씬 종류에 따른 종료 처리</text>
<text x="886" y="35" fill="#57634d" font-size="10" font-weight="500" text-anchor="end">SYSTEM / FLOW</text>
<polyline points="460.0,164 460.0,193.0 460.0,193.0 460.0,222" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="460.0,310 460.0,339.0 230.0,339.0 230.0,368" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="296.0" y="317.0" width="98" height="20" rx="3" fill="#f4f5f4"/>
<text x="345.0" y="331.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">시작 / 보스</text>
<polyline points="460.0,310 460.0,339.0 690.0,339.0 690.0,368" fill="none" stroke="#93a77f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="526.0" y="317.0" width="98" height="20" rx="3" fill="#f4f5f4"/>
<text x="575.0" y="331.0" fill="#57634d" font-size="12" font-weight="500" text-anchor="middle">승리 / 패배</text>
<rect x="270.0" y="76" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="460.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">PlayableDirector 재생</text>
<text x="460.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">게임 시간 / 강화 UI 제어</text>
<polygon points="288.0,222 632.0,222 650.0,266.0 632.0,310 288.0,310 270.0,266.0" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="460.0" y="257" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">종료한 컷씬의 종류</text>
<text x="460.0" y="281" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">종류별 종료 처리</text>
<rect x="40" y="368" width="380" height="88" rx="8" fill="#d1ddcc" stroke="#829a58"/>
<text x="230.0" y="403" fill="#4e6512" font-size="19" font-weight="600" text-anchor="middle">플레이 복귀</text>
<text x="230.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">시작 컷씬 / 보스 등장 컷씬</text>
<rect x="500" y="368" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="403" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">결과 화면 표시</text>
<text x="690.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">승리 컷씬 / 패배 컷씬</text>
<path d="M34 491H886" stroke="#c7d2c3"/>
<text x="34" y="515" fill="#57634d" font-size="12" font-weight="400" text-anchor="start">구현 설명을 요약한 개념도</text>
