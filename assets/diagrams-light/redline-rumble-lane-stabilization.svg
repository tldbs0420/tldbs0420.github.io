<text x="690.0" y="403" fill="#4e6512" font-size="19" font-weight="600" text-anchor="middle">velocity.normalized 적용</text>
<text x="690.0" y="427" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">과도한 속력을 낮춤</text>
