<text x="230.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">차선 변경 시작</text>
<text x="230.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">beforeLine / nowLine 비교</text>
<rect x="500" y="76" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="111" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">linearVelocity 재설정</text>
<text x="690.0" y="135" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">진행 방향에 맞춰 ±finishPower</text>
<polygon points="58,222 402,222 420,266.0 402,310 58,310 40,266.0" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="230.0" y="257" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">목표 좌표 통과</text>
<text x="230.0" y="281" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">lineChangeFinished 확인</text>
<rect x="500" y="222" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
<text x="690.0" y="257" fill="#16190e" font-size="19" font-weight="600" text-anchor="middle">속도 보정 + 상태 갱신</text>
<text x="690.0" y="281" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">beforeLine = nowLine</text>
<polygon points="58,368 402,368 420,412.0 402,456 58,456 40,412.0" fill="#eff2ef" stroke="#b3c1ab"/>
