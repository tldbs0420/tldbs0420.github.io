<text x="240.0" y="659" fill="#57634d" font-size="14" font-weight="400" text-anchor="middle">Toggle 비활성 / Hold 누르기 / 일반 입력</text>
<rect x="500" y="600" width="380" height="88" rx="8" fill="#eff2ef" stroke="#b3c1ab"/>
