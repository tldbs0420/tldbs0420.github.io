<svg xmlns="http://www.w3.org/2000/svg" width="920" height="772" viewBox="0 0 920 772" role="img" aria-labelledby="title desc">
<title id="title">입력 태그에 따른 활성화와 취소</title><desc id="desc">UMortisAbilitySystemComponent는 입력 태그와 어빌리티의 DynamicSpecSourceTags를 정확히 대조합니다. Toggle의 재입력과 Hold의 입력 해제를 서로 다른 함수에서 처리합니다.</desc>
